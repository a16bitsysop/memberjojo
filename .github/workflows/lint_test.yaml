name: lint and pytest

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint_pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.x']

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🛠️ Install build deps
        run: pip install ".[dev,lint]"

      - name: 🧹 Run black
        run: black --check --diff --color .

      - name: 🧹 Run pylint
        run: pylint .

      - name: 🧹 Run mypy
        run: mypy src

      - name: 🧪 Run pytest without sqlcipher
        run: |
          coverage run -m pytest
          coverage report -m

      - name: 🛠️ Install  libsqlcipher for sqlcipher3
        run: |
          sudo apt-get --no-install-recommends --no-install-suggests install libsqlcipher-dev
          pip install ".[sqlcipher]"

      - name: 🧪 Run pytest with sqlcipher
        run: |
          coverage run -m pytest
          coverage report -m

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: '**/*.md'
